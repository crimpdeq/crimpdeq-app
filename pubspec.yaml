name: crimpdeq
description: "Crimpdeq - Tindeq Progressor BLE Client"
publish_to: "none"
version: 0.3.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.1.0
  permission_handler: ^12.0.1
  fl_chart: ^1.0.0
  # State management
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.0
  # Code generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  google_fonts: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code generation
  build_runner: ^2.4.13
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.0+1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

# App icon configuration for all platforms
flutter_launcher_icons:
  image_path: assets/Logo_app_512x512.png
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/Logo_app_512x512.png
  macos:
    generate: true
    image_path: assets/Logo_app_512x512.png
  windows:
    generate: true
    image_path: assets/Logo_app_512x512.png
  linux:
    generate: true
    image_path: assets/Logo_app_512x512.png
