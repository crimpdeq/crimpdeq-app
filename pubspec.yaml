name: crimpdeq
description: "Crimpdeq - Tindeq Progressor BLE Client"
publish_to: "none"
version: 0.4.2

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # 2.3.5+ adds a build-time license ping that sends the app ID and name to a
  # third party, with no opt-out. Stay below it until that is accepted.
  flutter_blue_plus: 2.3.4
  permission_handler: ^13.0.2
  fl_chart: ^1.2.0
  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  # Code generation
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code generation
  build_runner: ^2.17.0
  freezed: ^4.0.2
  riverpod_generator: ^4.0.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
  # Bundled so the app renders the same offline. Licenses: assets/fonts/*-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

# App icon configuration for all platforms
flutter_launcher_icons:
  image_path: assets/Logo_app_512x512.png
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/Logo_app_512x512.png
  macos:
    generate: true
    image_path: assets/Logo_app_512x512.png
  windows:
    generate: true
    image_path: assets/Logo_app_512x512.png
  linux:
    generate: true
    image_path: assets/Logo_app_512x512.png
