name: crimpdeq
description: "Crimpdeq - Tindeq Progressor BLE Client"
publish_to: "none"
version: 0.4.2

environment:
  sdk: ">=3.10.3 <4.0.0"
  flutter: ">=3.38.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.1.1
  permission_handler: ^12.0.1
  fl_chart: ^1.0.0
  # State management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  # Code generation
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code generation
  build_runner: ^2.4.13
  freezed: ^3.2.5
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4

# Workaround: riverpod_generator's dependency tree excludes test_api 0.7.7
# (pinned by flutter_test). Override so version solving succeeds.
dependency_overrides:
  test_api: 0.7.8

flutter:
  uses-material-design: true
  assets:
    - assets/
  # Bundled so the app renders the same offline. Licenses: assets/fonts/*-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

# App icon configuration for all platforms
flutter_launcher_icons:
  image_path: assets/Logo_app_512x512.png
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/Logo_app_512x512.png
  macos:
    generate: true
    image_path: assets/Logo_app_512x512.png
  windows:
    generate: true
    image_path: assets/Logo_app_512x512.png
  linux:
    generate: true
    image_path: assets/Logo_app_512x512.png
