name: Build Crimpdeq App on Release

on:
  release:
    types: [created]

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java (required for Android tooling)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release artifact
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/crimpdeq-app-${{ github.ref_name }}.apk"

      - name: Upload APK to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release/*.apk
          file_glob: true
          tag: ${{ github.event.release.tag_name }}
          overwrite: true

  windows:
    name: Windows app
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Prepare release artifact (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $zipPath = "release/crimpdeq-app-$env:GITHUB_REF_NAME-windows.zip"
          # Find the correct runner/Release directory (supports build/windows/x64/runner/Release and others)
          $candidateDirs = Get-ChildItem -Path "build/windows" -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\runner\\Release$" }
          if (-not $candidateDirs -or $candidateDirs.Count -eq 0) {
            Write-Host "No runner/Release directory found under build/windows. Current tree:"
            Get-ChildItem -Path build/windows -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            exit 1
          }
          $releaseDir = $candidateDirs[0].FullName
          Write-Host "Zipping contents of $releaseDir"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath -Force

      - name: Upload Windows zip to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release/*.zip
          file_glob: true
          tag: ${{ github.event.release.tag_name }}
          overwrite: true

  macos:
    name: macOS app
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Prepare release artifact (zip)
        run: |
          mkdir -p release
          APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build/macos/Build/Products/Release"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release/crimpdeq-app-${{ github.ref_name }}-macos.zip"

      - name: Upload macOS zip to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release/*.zip
          file_glob: true
          tag: ${{ github.event.release.tag_name }}
          overwrite: true

  linux:
    name: Linux app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build Linux release
        run: flutter build linux --release

      - name: Prepare release artifact (zip)
        run: |
          mkdir -p release
          BUNDLE_DIR=build/linux/x64/release/bundle
          if [ ! -e "$BUNDLE_DIR/Crimpdeq" ]; then
            echo "No app bundle found at $BUNDLE_DIR"
            exit 1
          fi
          (cd "$BUNDLE_DIR" && zip -r ../../../../../release/crimpdeq-app-${{ github.ref_name }}-linux.zip .)

      - name: Upload Linux zip to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release/*.zip
          file_glob: true
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
  web-app:
    name: Deploy web app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java (required for Android tooling)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Install dependencies
        run: make install

      - name: Build web app
        run: make build-local

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2fc7f8105c4c2a621b320949cae125ae
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=crimpdeq-app --branch=main
